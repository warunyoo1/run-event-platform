# Production compose: ใช้ image จาก GHCR (ไม่ build บน server)
# API_PROXY_TARGET ถูกฝังใน image ตอน build (GitHub variable API_PROXY_TARGET)
# จึงไม่ต้องมี .env บน server และไม่ต้องตั้ง env ตอนรัน
# วางไฟล์นี้ไว้ใน DEPLOY_PATH (/var/www/projects/run-event-platform) แล้วรัน:
#   docker compose -f docker-compose.prod.yml pull platform
#   docker compose -f docker-compose.prod.yml up -d
services:
  platform:
    image: ghcr.io/warunyoo1/run-event-platform:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    # bind เฉพาะ loopback: ให้ nginx (DirectAdmin) บน host เป็นด่านหน้า ไม่เปิดออก IP ตรงๆ
    # host port เริ่มต้น 3001 เพื่อไม่ชนกับ admin ที่ใช้ 3000 บน server เดียวกัน
    ports:
      - "127.0.0.1:${PLATFORM_HOST_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
